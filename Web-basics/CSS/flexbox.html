<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
</head>
<style>
    .container{
        display: flex;
        background-color: pink;
        flex-direction: column;
    }
    .container div{
        background-color: rgb(161, 161, 207);
        padding:1px;
        margin: 10px;
    }
</style>
<body>
    <div class="container">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>
</body>
</html>
